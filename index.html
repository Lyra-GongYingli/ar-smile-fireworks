<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <meta name="description" content="Smile to make it rain, laugh to set off fireworks that bounce off your head. Browser AR prototype, all on-device." />
    <title>笑一笑 AR · Smile Rain, Laugh Fireworks</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2325f4ee'/%3E%3Cpath d='M18 36q14 16 28 0' stroke='%2307080c' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Capability check before any download. The tracker needs Wasm SIMD
      // (MediaPipe 1.2 ships no fallback build) and WebGL (even its CPU path
      // converts frames through WebGL). Incapable devices never start the
      // ~18 MB download; they go straight to the demo.
      (function () {
        var wasm = typeof WebAssembly === 'object';
        var simd = wasm && WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11]));
        var c = document.createElement('canvas');
        var g = c.getContext('webgl2') || c.getContext('webgl');
        if (g && g.getExtension('WEBGL_lose_context')) g.getExtension('WEBGL_lose_context').loseContext();
        var caps = (window.__caps = { wasm: wasm, simd: simd, gl: !!g });
        var forced = /[?&]caps=(\w+)/.exec(location.search); // QA: ?caps=gl simulates a missing capability
        if (forced && forced[1] in caps) caps[forced[1]] = false;
        // Capable devices: src/download.js (end of <body>) starts the downloads.
      })();
    </script>
    <link rel="modulepreload" href="vendor/mediapipe/vision_bundle.mjs" />
    <link rel="modulepreload" href="src/main.js" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-mode="intro">
    <div id="stage">
      <video id="cam" playsinline muted autoplay></video>
      <div id="demo-head" aria-hidden="true">
        <svg viewBox="0 0 100 132" preserveAspectRatio="none">
          <ellipse class="skull" cx="50" cy="66" rx="49" ry="65" />
          <ellipse class="eye" cx="33" cy="64" rx="5" ry="6.5" />
          <ellipse class="eye" cx="67" cy="64" rx="5" ry="6.5" />
          <path class="mouth m-none" d="M37 98 Q50 101 63 98" />
          <path class="mouth m-smile" d="M31 93 Q50 110 69 93" />
          <path class="mouth m-laugh" d="M31 91 Q50 128 69 91 Z" />
        </svg>
      </div>
      <canvas id="fx"></canvas>
    </div>

    <div id="status" class="chip" role="status" hidden></div>

    <!-- Text is in the HTML so the first paint is readable before any script
         arrives; i18n.js swaps it to English when needed. Buttons stay disabled
         until main.js has attached their handlers. -->
    <section id="intro" class="panel">
      <h1 data-t="title">笑一笑，下场雨；笑出声，放烟花</h1>
      <p class="lead" data-t="lead">微笑时屏幕下雨，大笑时烟花在头顶炸开，火花落到头上会弹开。晃头可以把火花甩走。</p>
      <div class="progress" aria-hidden="true"><div id="bar"></div></div>
      <p id="load-text" class="muted small">正在加载…</p>
      <button id="btn-start" class="btn primary" data-t="start" disabled>开启摄像头</button>
      <button id="btn-demo" class="btn ghost" data-t="demo" disabled>没有摄像头？看演示</button>
      <p class="muted small" data-t="privacy">画面只在你的设备上计算，不会上传。</p>
      <p id="inapp" class="warn small" data-t="inApp" hidden></p>
    </section>

    <section id="error" class="panel" hidden>
      <p id="err-text"></p>
      <button id="btn-retry" class="btn primary" data-t="retry">重试</button>
      <button id="btn-err-demo" class="btn ghost" data-t="demo">没有摄像头？看演示</button>
    </section>

    <!-- ?calibrate=1: guided expressions, records blendshape numbers only -->
    <section id="calib" class="calib" hidden>
      <div id="calib-meta" class="muted small"></div>
      <div id="calib-text" class="calib-text"></div>
      <div class="progress" aria-hidden="true"><div id="calib-bar"></div></div>
      <div id="calib-result" hidden></div>
      <div id="calib-actions" hidden>
        <button id="btn-calib-again" class="btn ghost" data-t="calibAgain">再测一次</button>
        <button id="btn-calib-copy" class="btn ghost" data-t="calibCopy">复制数据</button>
        <button id="btn-calib-download" class="btn ghost" data-t="calibDownload">下载数据</button>
      </div>
    </section>

    <section id="report" class="calib" hidden>
      <pre id="report-text"></pre>
      <div id="report-actions">
        <button id="btn-report-copy" class="btn ghost" data-t="reportCopy">复制</button>
        <button id="btn-report-close" class="btn ghost" data-t="reportClose">关闭</button>
      </div>
    </section>

    <div id="demo-pad">
      <button class="btn hold" data-hold="smile" data-t="holdSmile">按住：微笑</button>
      <button class="btn hold" data-hold="laugh" data-t="holdLaugh">按住：大笑</button>
    </div>

    <div id="controls">
      <button id="btn-report" class="btn tiny" data-t="report" hidden>报告</button>
      <button id="btn-hud" class="btn tiny" data-t="hud">性能</button>
    </div>

    <div id="hud" hidden>
      <div data-k="fps"></div>
      <div data-k="infer"></div>
      <div data-k="particles"></div>
      <div data-k="hits"></div>
      <div data-k="state"></div>
      <div class="meter"><span>smile</span><div class="track"><div class="fill" data-bar="smile"></div><i data-mark="smile"></i></div></div>
      <div class="meter"><span>jaw</span><div class="track"><div class="fill" data-bar="jaw"></div><i data-mark="jaw"></i></div></div>
    </div>

    <script src="src/download.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
