<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <meta name="description" content="Smile to make it rain, laugh to set off fireworks that bounce off your head. Browser AR prototype, all on-device." />
    <title>笑一笑 AR · Smile Rain, Laugh Fireworks</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2325f4ee'/%3E%3Cpath d='M18 36q14 16 28 0' stroke='%2307080c' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Capability check before any download. The tracker needs Wasm SIMD
      // (MediaPipe 1.2 ships no fallback build) and WebGL (even its CPU path
      // converts frames through WebGL). Only capable devices start the ~18 MB
      // preload; the rest go straight to the demo without paying for it.
      (function () {
        var wasm = typeof WebAssembly === 'object';
        var simd = wasm && WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11]));
        var c = document.createElement('canvas');
        var g = c.getContext('webgl2') || c.getContext('webgl');
        if (g && g.getExtension('WEBGL_lose_context')) g.getExtension('WEBGL_lose_context').loseContext();
        var caps = (window.__caps = { wasm: wasm, simd: simd, gl: !!g });
        var forced = /[?&]caps=(\w+)/.exec(location.search); // QA: ?caps=gl simulates a missing capability
        if (forced && forced[1] in caps) caps[forced[1]] = false;
        if (!caps.wasm || !caps.simd || !caps.gl) return;
        ['vendor/mediapipe/wasm/vision_wasm_internal.wasm', 'models/face_landmarker.task'].forEach(function (href) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'fetch';
          l.crossOrigin = 'anonymous';
          l.href = href;
          document.head.appendChild(l);
        });
      })();
    </script>
    <link rel="modulepreload" href="vendor/mediapipe/vision_bundle.mjs" />
    <link rel="modulepreload" href="src/main.js" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-mode="intro">
    <div id="stage">
      <video id="cam" playsinline muted autoplay></video>
      <div id="demo-head" aria-hidden="true">
        <svg viewBox="0 0 100 132" preserveAspectRatio="none">
          <ellipse class="skull" cx="50" cy="66" rx="49" ry="65" />
          <ellipse class="eye" cx="33" cy="64" rx="5" ry="6.5" />
          <ellipse class="eye" cx="67" cy="64" rx="5" ry="6.5" />
          <path class="mouth m-none" d="M37 98 Q50 101 63 98" />
          <path class="mouth m-smile" d="M31 93 Q50 110 69 93" />
          <path class="mouth m-laugh" d="M31 91 Q50 128 69 91 Z" />
        </svg>
      </div>
      <canvas id="fx"></canvas>
    </div>

    <div id="status" class="chip" role="status" hidden></div>

    <section id="intro" class="panel">
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>
      <div class="progress" aria-hidden="true"><div id="bar"></div></div>
      <p id="load-text" class="muted small"></p>
      <button id="btn-start" class="btn primary" data-t="start"></button>
      <button id="btn-demo" class="btn ghost" data-t="demo"></button>
      <p class="muted small" data-t="privacy"></p>
      <p id="inapp" class="warn small" data-t="inApp" hidden></p>
    </section>

    <section id="error" class="panel" hidden>
      <p id="err-text"></p>
      <button id="btn-retry" class="btn primary" data-t="retry"></button>
      <button id="btn-err-demo" class="btn ghost" data-t="demo"></button>
    </section>

    <div id="demo-pad">
      <button class="btn hold" data-hold="smile" data-t="holdSmile"></button>
      <button class="btn hold" data-hold="laugh" data-t="holdLaugh"></button>
    </div>

    <div id="controls">
      <button id="btn-hud" class="btn tiny" data-t="hud"></button>
    </div>

    <div id="hud" hidden>
      <div data-k="fps"></div>
      <div data-k="infer"></div>
      <div data-k="particles"></div>
      <div data-k="hits"></div>
      <div data-k="state"></div>
      <div class="meter"><span>smile</span><div class="track"><div class="fill" data-bar="smile"></div><i data-mark="smile"></i></div></div>
      <div class="meter"><span>jaw</span><div class="track"><div class="fill" data-bar="jaw"></div><i data-mark="jaw"></i></div></div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
